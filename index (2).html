<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Mission MCQ Test - Correct Spelling</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --danger-color: #e74c3c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Style */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .site-header img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 50%;
        }

        .site-header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary-color);
        }

        /* Card screens */
        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* Static Info Badge */
        .info-badge {
            background-color: #eef2f6;
            border-left: 4px solid #3b82f6;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #219150;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 10px;
            z-index: 100;
            margin-bottom: 20px;
        }

        .timer {
            font-size: 18px;
            font-weight: bold;
            color: var(--danger-color);
        }

        /* Question Options */
        .question-card {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .question-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .options-list li {
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-label:hover {
            background: #f1f5f9;
        }

        .option-label input {
            margin-right: 12px;
        }

        /* Results & Explanations */
        .correct-answer {
            background-color: #d1e7dd !important;
            border-color: #a3cfbb !important;
            color: #0f5132;
        }

        .wrong-answer {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #842029;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: #eef2f6;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
            display: none;
        }

        .submit-btn {
            margin-top: 10px;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header with Logo -->
    <header class="site-header">
        <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/50?text=TM'">
        <h1>Test Mission MCQ Test</h1>

    <!-- Start Screen -->
    <div id="start-screen" class="card">

            📝 মোট প্রশ্ন: <b>৪১ টি</b> | ⏱ প্রতি প্রশ্নে সময়: <b>২০ সেকেন্ড</b> (মোট ১৩ মিনিট ৪০ সেকেন্ড)<br>
            ✔️ সঠিক উত্তর: <b>+১.০০</b> | ❌ ভুল উত্তর: <b>-০.২৫</b>
        </p>

        <button onclick="startExam()">পরীক্ষা শুরু করুন</button>
    </div>

    <!-- Exam Screen -->
    <div id="exam-screen" class="hidden">
        <div class="top-bar">
            <div>
                <strong>পরীক্ষার্থী:</strong> <span id="display-name"></span><br>
                <small><strong>বিষয়/টপিক:</strong> <span id="display-subject-topic"></span></small>
            </div>
            <div class="timer">সময় বাকি: <span id="timer">00:00</span></div>
        </div>

        <div id="questions-container"></div>

        <button class="submit-btn" onclick="submitExam()">পরীক্ষা সাবমিট করুন</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="card hidden">

        <div id="result-details"></div>
        <button onclick="location.reload()" style="margin-top: 20px;">পুনরায় পরীক্ষা দিন</button>
    </div>
</div>

        },
        {
            "question": "19. What is the correct spelling of 'Amateur'?",
            "options": ["Amature", "Amateur", "Amatuer", "Amaturee"],
            "answer": 1,
            "explanation": "ama + teur, ফরাসি শব্দ।"

            "answer": 1,

        },

            "question": "21. What is the correct spelling of 'Anaemia'?",
            "options": ["Anemia", "Anaemia", "Anemiaa", "Anaimia"],
            "answer": 1,
            "explanation": "an + aemia, 'ae' একসাথে।"

        },
        {
            "question": "27. What is the correct spelling of 'Besiege'?",
            "options": ["Besiege", "Beseige", "Besege", "Besige"],
            "answer": 0,
            "explanation": "be + siege, 'ie'।"
        },
        {
            "question": "28. What is the correct spelling of 'Bourgeois'?",
            "options": ["Bourgeois", "Bourgeois", "Bourgeois", "Bourgeos"],
            "answer": 0,
            "explanation": "ফরাসি 'bourg' + 'eois'।"
        },
        {
            "question": "29. What is the correct spelling of 'Camouflage'?",
            "options": ["Camoflage", "Camouflage", "Camoufladge", "Camofladge"],
            "answer": 1,
            "explanation": "camou + flage, ফরাসি।"
        },
        {
            "question": "30. What is the correct spelling of 'Celestial'?",
            "options": ["Celestial", "Celestial", "Celestal", "Celestil"],

        },

            "question": "31. What is the correct spelling of 'Cemetery'?",

        },
        {
            "question": "33. What is the correct spelling of 'Commemoration'?",
            "options": ["Commemoration", "Commemmoration", "Comemoration", "Commemoretion"],

        },

        },
        {

        },
        {

    ];

    let timerInterval;
    const TIME_PER_QUESTION = 20; // প্রতি প্রশ্নে ২০ সেকেন্ড
    let totalTime = questionsData.length * TIME_PER_QUESTION; 
    let hasSubmitted = false;

    // ইনফো ব্যাজে তথ্য সেট করা
    document.getElementById('info-subject').innerText = currentSubject;
    document.getElementById('info-topic').innerText = currentTopic;

    function startExam() {
        const userName = document.getElementById('user-name').value.trim();

        if (!userName) {
            alert('অনুগ্রহ করে আপনার নাম বা কোড লিখুন!');
            return;
        }

        document.getElementById('display-name').innerText = userName;
        document.getElementById('display-subject-topic').innerText = `${currentSubject} - ${currentTopic}`;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('exam-screen').classList.remove('hidden');

        renderQuestions();
        startTimer();
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        let html = '';

        questionsData.forEach((q, qIndex) => {
            html += `
                <div class="question-card" id="q-card-${qIndex}">
                    <div class="question-title">${q.question}</div>
                    <ul class="options-list">
            `;
            
            q.options.forEach((opt, oIndex) => {
                html += `
                    <li>
                        <label class="option-label" id="label-${qIndex}-${oIndex}">
                            <input type="radio" name="q${qIndex}" value="${oIndex}">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            html += `
                    </ul>
                    <div class="explanation" id="exp-${qIndex}">
                        <strong>সঠিক উত্তর:</strong> ${q.options[q.answer]}<br><br>
                        <strong>ব্যাখ্যা:</strong> ${q.explanation}
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            totalTime--;
            updateTimerDisplay();

            if (totalTime <= 0) {
                clearInterval(timerInterval);
                if (!hasSubmitted) {
                    alert('সময় শেষ! আপনার পরীক্ষা স্বয়ংক্রিয়ভাবে জমা নেওয়া হচ্ছে।');
                    submitExam();
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = Math.floor(totalTime / 60).toString().padStart(2, '0');
        const s = (totalTime % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
    }

    function submitExam() {
        if (hasSubmitted) return;
        hasSubmitted = true;
        clearInterval(timerInterval);

        let correctCount = 0;
        let wrongCount = 0;
        let unattemptedCount = 0;

        questionsData.forEach((q, qIndex) => {
            const selected = document.querySelector(`input[name="q${qIndex}"]:checked`);
            
            // সঠিক উত্তর সবুজ মার্ক করা
            document.getElementById(`label-${qIndex}-${q.answer}`).classList.add('correct-answer');
            
            // ব্যাখ্যা শো করা
            document.getElementById(`exp-${qIndex}`).style.display = 'block';

            if (selected) {
                const selectedVal = parseInt(selected.value);
                if (selectedVal === q.answer) {
                    correctCount++;
                } else {
                    wrongCount++;
                    // ভুল অপশন লাল মার্ক করা
                    document.getElementById(`label-${qIndex}-${selectedVal}`).classList.add('wrong-answer');
                }
            } else {
                unattemptedCount++;
            }

            // অপশনগুলো নিষ্ক্রিয় করা
            document.querySelectorAll(`input[name="q${qIndex}"]`).forEach(r => r.disabled = true);
        });

        const score = (correctCount * 1) - (wrongCount * 0.25);
        const userName = document.getElementById('user-name').value.trim();

        // গুগল শিটে রেজাল্ট পাঠানো (যদি লিঙ্ক দেওয়া থাকে)
        if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("https://script.google.com/macros/s/AKfycbyUqt7ngETw5UON78vQLofIw-frPRIOSKxG0NqBm0xwMr90ydNmsfV8roFv5X3pgbDR/exec")) {
            const payload = {
                name: userName,
                subject: currentSubject,
                topic: currentTopic,
                correct: correctCount,
                wrong: wrongCount,
                unattempted: unattemptedCount,
                score: score.toFixed(2)
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }

        // ফলাফল প্রদর্শন
        document.querySelector('.submit-btn').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('result-details').innerHTML = `
            <p><strong>পরীক্ষার্থীর নাম/কোড:</strong> ${userName}</p>
            <p><strong>বিষয়:</strong> ${currentSubject} (${currentTopic})</p>
            <p><strong>মোট প্রশ্ন:</strong> ${questionsData.length} টি</p>
            <p><strong>সঠিক উত্তর:</strong> <span style="color: green; font-weight: bold;">${correctCount}</span> টি</p>
            <p><strong>ভুল উত্তর:</strong> <span style="color: red; font-weight: bold;">${wrongCount}</span> টি</p>
            <p><strong>উত্তর দেওয়া হয়নি:</strong> ${unattemptedCount} টি</p>
            <hr>
            <h3 style="color: var(--primary-color);">প্রাপ্ত নম্বর: ${score.toFixed(2)} / ${questionsData.length}</h3>
            <p style="font-size: 13px; color: #666;">(নিচে স্ক্রল করে প্রতিটি প্রশ্নের সঠিক উত্তর ও ব্যাখ্যা দেখতে পারেন)</p>
        `;

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
